name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_demo:
        description: Deploy the bundle to the demo target
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project and CI tools
        run: |
          uv sync --no-dev
          uv pip install pytest ruff

      - name: Run tests
        run: .venv/bin/python -m pytest

      - name: Run lint
        run: .venv/bin/ruff check .

      - name: Build wheel
        run: uv build --wheel

  deploy-demo:
    name: Deploy demo bundle
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_demo
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: Demo
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.9.0

      - name: Validate demo bundle
        run: databricks bundle validate --strict --target demo

      - name: Deploy demo bundle
        run: databricks bundle deploy --target demo --auto-approve
